name: Publish versioned trial
on:
  push:
    branches: [main]
    paths: [scripts/build-app.sh]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - run: ./scripts/test.sh
      - run: BUILD_UNIVERSAL=1 ./scripts/build-app.sh
  release:
    needs: compatibility
    permissions:
      contents: write
    env:
      BUILD_UNIVERSAL: '1'
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Configure Developer ID signing and notarization
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" ]]; then
            echo 'Signing certificate is present but notarization secrets are incomplete.' >&2
            exit 1
          fi
          cert="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/opentangerine-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=opentangerine-notary" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "opentangerine-notary" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          rm -f "$cert"
      - name: Build and test
        run: |
          ./scripts/test.sh
          ./scripts/build-app.sh
      - name: Verify trial bundle integrity
        run: |
          codesign --verify --deep --strict --verbose=2 'dist/Open Tangerine.app'
          test -x 'dist/Open Tangerine.app/Contents/MacOS/OpenTangerine'
          plutil -lint 'dist/Open Tangerine.app/Contents/Info.plist'
          xcrun lipo 'dist/Open Tangerine.app/Contents/MacOS/OpenTangerine' -verify_arch arm64 x86_64
          if [[ -n "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            spctl --assess --type execute --verbose=2 'dist/Open Tangerine.app'
          else
            echo 'Built ad-hoc signed trial (no Developer ID secrets configured).'
          fi
      - name: Package and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Open Tangerine.app/Contents/Info.plist')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; increment the version to publish changes.'
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent 'dist/Open Tangerine.app' "dist/Open-Tangerine-$VERSION-macOS.zip"
          shasum -a 256 "dist/Open-Tangerine-$VERSION-macOS.zip" > dist/SHA256SUMS.txt
          gh release create "v$VERSION" "dist/Open-Tangerine-$VERSION-macOS.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Open Tangerine $VERSION · Developer trial" --notes 'macOS 15+ compatibility release, universal Intel/Apple silicon binary. Preserves native Liquid Glass on macOS 26 and uses material fallback on older systems. Includes non-notched HUD positioning and radial window fixes. Thanks to Teshgotcode (#1) and Devansh-Kumar-Saini (#5). Automated macOS 15/26 build and regression checks; individual Intel hardware/desktop arrangements remain unverified. Ad-hoc signed, NOT Apple-notarized. Download, quit and replace manually; keep the previous app for rollback. https://sintaxerrorpvtltd.github.io/Open-Tangerine/#download'
