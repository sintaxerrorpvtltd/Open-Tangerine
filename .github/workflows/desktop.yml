name: Windows and Linux desktop
on:
  push:
    branches: [main]
    paths: ['Desktop/**', '.github/workflows/desktop.yml', 'CONTRIBUTING.md']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/desktop.yml', 'CONTRIBUTING.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Desktop
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-2025' && 'windows' || 'xcb' }}
      OPEN_TANGERINE_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt and media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 ffmpeg xvfb xauth
      - name: Windows media test dependency
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install pinned desktop dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Windows conversion, safety and native UI tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Linux conversion, safety and X11 UI tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Package portable app with source and licenses
        run: python package.py
      - name: Windows extracted-package checks
        if: runner.os == 'Windows'
        run: python smoke_package.py
      - name: Linux extracted-package checks
        if: runner.os == 'Linux'
        run: xvfb-run -a python smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            Desktop/dist/Open-Tangerine-*.zip
            Desktop/dist/Open-Tangerine-*.tar.gz
            Desktop/dist/Open-Tangerine-*.sha256
          if-no-files-found: error
  publish:
    needs: desktop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view desktop-v0.2.0 >/dev/null 2>&1; then
            echo 'Version already exists; never replace published binaries silently.'
            exit 0
          fi
          gh release create desktop-v0.2.0 release-assets/* --target "$GITHUB_SHA" --prerelease --title 'Windows and Linux 0.2.0 · Early desktop trial' --notes-file Desktop/RELEASE.md
